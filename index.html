<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Monster Maths">
<meta name="theme-color" content="#2E1A47">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Monster Maths</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --grape:#2E1A47;
    --lime:#C6F135;
    --pink:#FF5CA8;
    --tangerine:#FF9F1C;
    --sky:#4CC9F0;
    --cream:#FFF4E0;
    --ink:#160C24;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{height:100%;overflow:hidden}

  body{
    margin:0;
    font-family:'Fredoka',system-ui,-apple-system,sans-serif;
    background:var(--grape);
    background-image:
      radial-gradient(circle at 18% 10%, rgba(255,159,28,.18), transparent 44%),
      radial-gradient(circle at 82% 86%, rgba(76,201,240,.18), transparent 46%);
    color:var(--cream);
    display:flex;justify-content:center;
    touch-action:manipulation;
  }

  .stage{
    width:100%;max-width:460px;
    display:flex;flex-direction:column;gap:16px;
    padding:calc(env(safe-area-inset-top) + 22px) 16px calc(env(safe-area-inset-bottom) + 20px);
  }

  .wordmark{
    font-size:clamp(38px,12vw,52px);
    font-weight:700;line-height:.88;letter-spacing:-.02em;
    margin:0;color:var(--lime);text-shadow:5px 5px 0 var(--ink);
    flex:none;
  }
  .wordmark span{display:block;color:var(--pink)}

  .doors{display:flex;flex-direction:column;gap:16px;flex:1;justify-content:center;min-height:0}

  .door{
    display:flex;align-items:center;gap:16px;
    background:rgba(255,244,224,.08);
    border:5px solid var(--ink);border-radius:28px;
    box-shadow:0 7px 0 var(--ink);
    padding:18px 16px;cursor:pointer;
    text-decoration:none;color:inherit;
    transition:transform .07s ease, box-shadow .07s ease;
  }
  .door:active{transform:translateY(7px);box-shadow:0 0 0 var(--ink)}
  .door svg{width:92px;height:92px;flex:none}
  .door h2{margin:0;font-size:26px;font-weight:700;line-height:1.05}
  .door p{margin:5px 0 0;font-size:14.5px;font-weight:500;color:rgba(255,244,224,.6);line-height:1.35}
  .door .age{
    display:inline-block;margin-top:8px;
    font-size:12.5px;font-weight:600;letter-spacing:.05em;
    padding:4px 10px;border-radius:20px;
  }
  .door.little .age{background:var(--pink);color:var(--ink)}
  .door.big .age{background:var(--sky);color:var(--ink)}

  .foot{
    text-align:center;font-size:13px;font-weight:500;
    color:rgba(255,244,224,.32);flex:none;
  }

  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .door.little svg{animation:float 3.2s ease-in-out infinite}
  .door.big svg{animation:float 3.2s ease-in-out .9s infinite}

  @media (prefers-reduced-motion:reduce){*{animation:none !important}}
</style>
</head>
<body>
<div class="stage">

  <h1 class="wordmark">Monster<span>Maths</span></h1>

  <div class="doors">

    <a class="door little" href="count.html">
      <svg viewBox="0 0 120 120">
        <ellipse cx="60" cy="112" rx="32" ry="5" fill="rgba(0,0,0,.28)"/>
        <path d="M24 62c0-22 16-38 36-38s36 16 36 38v18c0 12-16 20-36 20s-36-8-36-20z"
              fill="#FF5CA8" stroke="#160C24" stroke-width="5" stroke-linejoin="round"/>
        <path d="M34 28l6 16M86 28l-6 16" stroke="#160C24" stroke-width="5" stroke-linecap="round"/>
        <circle cx="34" cy="25" r="6.5" fill="#C6F135" stroke="#160C24" stroke-width="4"/>
        <circle cx="86" cy="25" r="6.5" fill="#C6F135" stroke="#160C24" stroke-width="4"/>
        <circle cx="47" cy="58" r="12.5" fill="#FFF4E0" stroke="#160C24" stroke-width="4"/>
        <circle cx="75" cy="58" r="12.5" fill="#FFF4E0" stroke="#160C24" stroke-width="4"/>
        <circle cx="47" cy="60" r="5.5" fill="#160C24"/>
        <circle cx="75" cy="60" r="5.5" fill="#160C24"/>
        <path d="M44 78q16 16 32 0" fill="none" stroke="#160C24" stroke-width="5" stroke-linecap="round"/>
      </svg>
      <div>
        <h2>Grumbo</h2>
        <p>Counting, sharing and spotting which pile is bigger. Talks out loud.</p>
        <span class="age">AGES 3–5</span>
      </div>
    </a>

    <a class="door big" href="math.html">
      <svg viewBox="0 0 120 120">
        <ellipse cx="60" cy="112" rx="32" ry="5" fill="rgba(0,0,0,.28)"/>
        <path d="M22 58c0-20 17-34 38-34s38 14 38 34v22c0 11-17 18-38 18s-38-7-38-18z"
              fill="#4CC9F0" stroke="#160C24" stroke-width="5" stroke-linejoin="round"/>
        <path d="M60 24V8" stroke="#160C24" stroke-width="5" stroke-linecap="round"/>
        <circle cx="60" cy="8" r="7" fill="#FF9F1C" stroke="#160C24" stroke-width="4"/>
        <circle cx="60" cy="54" r="19" fill="#FFF4E0" stroke="#160C24" stroke-width="5"/>
        <circle cx="60" cy="56" r="8" fill="#160C24"/>
        <path d="M42 86h36" stroke="#160C24" stroke-width="5" stroke-linecap="round"/>
        <path d="M50 86v7M60 86v7M70 86v7" stroke="#160C24" stroke-width="4.5" stroke-linecap="round"/>
      </svg>
      <div>
        <h2>Zizzo</h2>
        <p>Add, take away, times and share &mdash; each one drawn as a picture so it makes sense.</p>
        <span class="age">AGES 5–9</span>
      </div>
    </a>

  </div>

  <p class="foot">Pick a monster</p>
</div>
</body>
</html>
